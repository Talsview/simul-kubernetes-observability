apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: simul
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: simul
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: simul
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
        - name: backend
          image: simul-backend:etapa4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=55.0 -XX:InitialRAMPercentage=20.0 -XX:+UseSerialGC -XX:ActiveProcessorCount=1"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SMTP_PASSWORD
            - name: WEB_PUSH_VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: WEB_PUSH_VAPID_PUBLIC_KEY
            - name: WEB_PUSH_VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: WEB_PUSH_VAPID_PRIVATE_KEY
            - name: WEB_PUSH_VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: WEB_PUSH_VAPID_SUBJECT
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
