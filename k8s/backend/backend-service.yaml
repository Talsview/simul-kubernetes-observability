apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: simul
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: simul
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
