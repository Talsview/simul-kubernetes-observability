# =============================================================
# SIMUL - Nginx do front-end
# Este arquivo e um TEMPLATE: ${BACKEND_UPSTREAM} e ${DNS_RESOLVER}
# sao substituidos na inicializacao do container (ver Dockerfile).
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # DNS usado para resolver o back-end a cada 10 s.
    # Com o nome do upstream em VARIAVEL (ver location /api/), o Nginx NAO
    # resolve o host ao iniciar. Assim o front-end sobe mesmo que o Service
    # do back-end ainda nao exista, e acompanha mudancas de IP.
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Cabecalhos em nivel de server. ATENCAO: se uma location declarar seus
    # proprios add_header, estes deixam de ser herdados. Por isso as locations
    # abaixo usam "expires" (que nao interfere nessa heranca) em vez de add_header.
    #   X-Frontend-Pod : nome do Pod/host do Nginx que atendeu (demonstracao)
    add_header X-Frontend-Pod $hostname always;
    add_header X-Content-Type-Options nosniff always;

    # Verificacao de saude do proprio Nginx (readiness/liveness do front-end).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Proxy reverso: /api/... -> back-end (mesma origem para o navegador).
    # - O URI original e repassado sem alteracao (a variavel nao contem caminho).
    # - proxy_http_version permanece no padrao (1.0): sem conexao persistente com
    #   o back-end, cada requisicao abre conexao nova e o kube-proxy pode
    #   distribui-las entre as replicas. Cabecalhos de resposta do back-end
    #   (ex.: X-Served-By) sao repassados ao cliente.
    location /api/ {
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass http://$backend_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Endpoints de gerenciamento do back-end nunca sao expostos pelo navegador.
    location /actuator {
        return 404;
    }

    # Arquivos com hash no nome gerados pelo Vite: cache longo.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Nunca manter em cache: index.html (aponta para os arquivos com hash)
    # e o Service Worker (precisa ser revalidado para atualizar).
    location = /index.html { expires -1; }
    location = /sw.js      { expires -1; }

    # SPA (BrowserRouter): qualquer rota desconhecida devolve o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
