apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: simul
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: simul
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
