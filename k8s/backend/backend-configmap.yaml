apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: simul
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: simul
data:
  PORT: "8080"
  DB_URL: "jdbc:postgresql://postgres-service.simul.svc.cluster.local:5432/simul"
  JWT_EXPIRATION_SECONDS: "3600"
  SMTP_HOST: "127.0.0.1"
  SMTP_PORT: "1025"
  SMTP_FROM: "no-reply@example.invalid"
  SIMUL_TIME_ZONE: "America/Sao_Paulo"
  NOTIFICACAO_SCHEDULER_ENABLED: "false"
  NOTIFICACAO_SCHEDULER_CRON: "0 * * * * *"
  SIMUL_CORS_ALLOWED_ORIGINS: "http://localhost:30080,http://127.0.0.1:30080"
  EMAIL_VERIFICATION_EXPIRATION_HOURS: "24"
  PASSWORD_RECOVERY_EXPIRATION_MINUTES: "60"
  SIMUL_FRONTEND_URL: "http://localhost:30080"
